name: my_photo_editor_ai
description: My Photo Editor AI - Complete offline-first professional AI photo editor for Android.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  image: ^4.8.0
  image_picker: ^1.2.1
  google_mlkit_selfie_segmentation: ^1.0.3
  google_mlkit_face_detection: ^1.0.3
  tflite_flutter: ^0.12.1
  google_mobile_ads: ^9.2.0
  sqflite: ^2.4.2
  shared_preferences: ^2.5.3
  path_provider: ^2.1.5
  path: ^1.9.1
  gal: ^2.3.2
  share_plus: ^12.0.1
  crypto: ^3.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/ai_models/
    - assets/licenses/
